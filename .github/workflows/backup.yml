name: Weekly database backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          STAMP=$(date +%Y-%m-%d)
          pg_dump "$DB_URL" --no-owner --no-acl -f "backup-$STAMP.sql"
          SIZE=$(stat -c%s "backup-$STAMP.sql")
          echo "Dump size: $SIZE bytes"
          if [ "$SIZE" -lt 2000 ]; then
            echo "Dump is suspiciously small — failing."
            exit 1
          fi
          grep -q "CREATE TABLE public.worker" "backup-$STAMP.sql" || { echo "worker table missing"; exit 1; }
          gzip "backup-$STAMP.sql"
          ls -lh backup-*.sql.gz

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql.gz
          retention-days: 90